# The code pack: the base every other pack builds on. It names the kinds and relations of a
# software system's code, the languages a file's extension gives, the images that make a compose
# service a datastore or a queue, the hint kinds linkers join, and the lenses that read them.
#
# A declaration names its own short ID ("service"); every reference elsewhere names a qualified
# one ("code.service"), from this pack, a pack it requires, or the kernel.

format = "planroom.pack/v1"
id = "code"
version = 1
title = "Code"
requires = []

# Kinds. Every Container-level kind takes the kernel's prefix `container`, so a container that an
# image role reclassifies keeps its ID (DR-46).

[[kinds]]
id = "workspace"
id_prefix = "workspace"
level = "system"
label = "Workspace"

[[kinds]]
id = "repo"
id_prefix = "repo"
level = "system"
label = "Repo"
props = { type = "object", properties = { languages = { type = "array", items = { type = "string" } } } }

[[kinds]]
id = "service"
id_prefix = "container"
level = "container"
label = "Service"
parents = ["code.repo", "code.workspace"]
props = { type = "object", properties = { role = { type = "string" }, image = { type = "string" } } }
tone = "service"

[[kinds]]
id = "datastore"
id_prefix = "container"
level = "container"
label = "Datastore"
parents = ["code.repo", "code.workspace"]
props = { type = "object", properties = { role = { type = "string" }, image = { type = "string" } } }
tone = "store"

[[kinds]]
id = "queue"
id_prefix = "container"
level = "container"
label = "Queue"
parents = ["code.repo", "code.workspace"]
props = { type = "object", properties = { role = { type = "string" }, image = { type = "string" } } }
tone = "store"

[[kinds]]
id = "library"
id_prefix = "container"
level = "container"
label = "Library"
parents = ["code.repo"]
props = { type = "object", properties = { role = { type = "string" } } }
tone = "library"

[[kinds]]
id = "tooling"
id_prefix = "container"
level = "container"
label = "Tooling"
parents = ["code.repo"]
props = { type = "object", properties = { role = { type = "string" }, compose_project = { type = "string" } } }
tone = "infra"

[[kinds]]
id = "package"
id_prefix = "pkg"
level = "component"
label = "Package"
parents = ["code.repo", "code.directory", "code.service", "code.library", "code.tooling"]

[[kinds]]
id = "module"
id_prefix = "module"
level = "component"
label = "Module"
parents = ["code.repo", "code.package"]

[[kinds]]
id = "directory"
id_prefix = "dir"
level = "component"
label = "Directory"
parents = ["code.repo", "code.directory", "code.package", "code.service", "code.library", "code.tooling"]

[[kinds]]
id = "file"
id_prefix = "file"
level = "code"
label = "File"
parents = ["code.repo", "code.directory", "code.package", "code.service", "code.library", "code.tooling"]
props = { type = "object", properties = { language = { type = "string" } } }

[[kinds]]
id = "api_spec"
id_prefix = "spec"
level = "component"
label = "API spec"
parents = ["code.repo", "code.directory", "code.service"]

[[kinds]]
id = "endpoint"
id_prefix = "endpoint"
level = "code"
label = "Endpoint"
parents = ["code.service", "code.library"]
props = { type = "object", properties = { method = { type = "string" }, path = { type = "string" } } }

[[kinds]]
id = "person"
id_prefix = "person"
level = "component"
label = "Person"
parents = ["code.repo"]

[[kinds]]
id = "commit"
id_prefix = "commit"
level = "code"
label = "Commit"
parents = ["code.repo"]

# Relations between containers, which the runtime lenses lift, then the code-level ones.

[[relations]]
id = "http"
from = ["code.service", "code.library", "code.tooling"]
to = ["code.service", "code.library"]
label = "calls over HTTP"
props = { type = "object", properties = { method = { type = "string" }, path = { type = "string" } } }

[[relations]]
id = "queue_publish"
from = ["code.service", "code.library", "code.tooling"]
to = ["code.queue"]
label = "publishes to"
props = { type = "object", properties = { key = { type = "string" } } }

[[relations]]
id = "queue_consume"
from = ["code.service", "code.library", "code.tooling"]
to = ["code.queue"]
label = "consumes from"
props = { type = "object", properties = { key = { type = "string" } } }

[[relations]]
id = "db"
from = ["code.service", "code.library", "code.tooling"]
to = ["code.datastore"]
label = "reads and writes"
props = { type = "object", properties = { driver = { type = "string" } } }

[[relations]]
id = "imports"
from = ["code.file"]
to = ["code.file", "code.module", "code.package", "kernel.external"]
label = "imports"

[[relations]]
id = "depends_on_package"
from = ["code.repo", "code.package", "code.service", "code.library", "code.tooling"]
to = ["code.package", "code.library", "kernel.external"]
label = "depends on"
props = { type = "object", properties = { uses = { type = "string" } } }

[[relations]]
id = "co_change"
from = ["code.file", "code.directory"]
to = ["code.file", "code.directory"]
label = "changes with"
props = { type = "object", properties = { count = { type = "integer" } } }

[[relations]]
id = "owned_by"
from = ["code.repo", "code.directory", "code.file"]
to = ["code.person"]
label = "owned by"

# The languages a file's extension gives, and the comment marks the declarative runner blanks.
# Each language with a built-in grammar, TypeScript, TSX, JavaScript, Python, Go and Rust, has a
# file of its own in languages/, beside the extractors that read it, and its query in queries/.

[[languages]]
id = "yaml"
extensions = ["yml", "yaml"]
line_comment = "#"

[[languages]]
id = "json"
extensions = ["json"]

# A compose service's kind and role by its image; any other service is a code.service.

[[image_roles]]
image = "postgres*"
role = "datastore"
kind = "code.datastore"

[[image_roles]]
image = "mysql*"
role = "datastore"
kind = "code.datastore"

[[image_roles]]
image = "redis*"
role = "queue"
kind = "code.queue"

[[image_roles]]
image = "rabbitmq*"
role = "queue"
kind = "code.queue"

# Hint kinds: partial observations the code pack's linkers join into edges across repos (DR-12).

[[hints]]
id = "url"
attrs = ["scheme", "host", "port", "path", "method"]

[[hints]]
id = "env_read"
attrs = ["name", "default"]

[[hints]]
id = "env_set"
attrs = ["service", "name", "value"]

[[hints]]
id = "depends_on"
attrs = ["service"]

[[hints]]
id = "route_serve"
attrs = ["method", "path"]

[[hints]]
id = "route_call"
attrs = ["method", "path", "base"]

[[hints]]
id = "queue_op"
attrs = ["op", "key"]

[[hints]]
id = "db_open"
attrs = ["driver"]

[[hints]]
id = "sql"
attrs = ["verb", "table"]

# A definition and a call carry no attributes: the key is the name, and the value a definition's
# parameter list and a call's arguments, as the source writes them. A map of attributes would hold
# more than the hint itself, on every call of every file.
[[hints]]
id = "def"
attrs = []

[[hints]]
id = "call"
attrs = []

# A compose service, scoped to its compose file and keyed by its name: what runtime_wiring makes
# a container of, joined to the repo its build context or image names.
[[hints]]
id = "compose_service"
attrs = ["image", "build", "kind", "role"]

# A string constant, keyed by its name, with its string as the value: what resolves a queue key or
# an environment read's default named in its file, and a queue key named in a file that imports
# its module.
[[hints]]
id = "const"
attrs = []

# A span of test code inside a file, such as a Rust item `#[cfg(test)]` marks: its line is the
# span's first and `end` its last. No linker reads a hint on a line one holds, as none reads one
# from a test file, and none shows the span itself. A module's declaration at a file's top level
# also names the `module`, and the `path` its `#[path]` attribute gives: no linker reads a hint
# from the files Rust reads that module from. A module declared inline is `inline`, and has no
# file of its own.
[[hints]]
id = "test_scope"
attrs = ["end", "module", "path", "inline"]

# An import, scoped to its file and keyed by the specifier as the source writes it: what the
# imports linker joins to a workspace package, and what resolves a constant a queue key names from
# another module of its repo. `separator` is the language's path separator, when the specifier's
# first segment names a package: `.` in Python, `::` in Rust.
[[hints]]
id = "import"
attrs = ["separator"]

# Built-in extractors. Each names the kinds it emits; the engine gives it their levels and prefixes.

[[extractors]]
id = "files"
builtin = "files"
files = ["**"]
options = { kinds = { repo = "code.repo", directory = "code.directory", file = "code.file" } }

[[extractors]]
id = "compose"
builtin = "compose"
files = ["**/docker-compose.yml", "**/docker-compose.yaml", "**/compose.yml", "**/compose.yaml"]
options = { kinds = { service = "code.service", tooling = "code.tooling", repo = "code.repo", file = "code.file" } }

# Each manifest's package and dependencies; the root manifest's package is the repo's container,
# a library until a deployment runs it as a service.
[[extractors]]
id = "manifest"
builtin = "manifest"
files = ["**/package.json", "**/go.mod", "**/pyproject.toml", "**/Cargo.toml"]
options = { kinds = { package = "code.package", library = "code.library", repo = "code.repo", directory = "code.directory" } }

# Each OpenAPI or Swagger spec, and the endpoints it serves on their lines.
[[extractors]]
id = "openapi"
builtin = "openapi"
files = ["**/openapi.yaml", "**/openapi.yml", "**/openapi.json", "**/swagger.yaml", "**/swagger.yml", "**/swagger.json"]
options = { kinds = { spec = "code.api_spec", repo = "code.repo", directory = "code.directory" } }

# URL and DSN literals in the code of the five languages: what a call or a database open reaches.
# A part the URL leaves out, its port or its path, is left out of the hint.
[[extractors]]
id = "urls"
files = ["**/*.ts", "**/*.mts", "**/*.cts", "**/*.tsx", "**/*.js", "**/*.mjs", "**/*.cjs", "**/*.jsx", "**/*.py", "**/*.go", "**/*.rs"]
regex = '''(?i)\b(https?|wss?|postgres(?:ql)?|redis|rediss|amqps?|mysql|mongodb(?:\+srv)?|nats|grpc)://(?:[^\s/@'"`]*@)?([a-z0-9](?:[a-z0-9.-]*[a-z0-9])?)(?::(\d+))?(/[^\s'"`]*)?'''
emit = [
  { hint = "code.url", scope = "@id:code.file:$file", key = "$2", attrs = { scheme = "$1", host = "$2", port = "$3", path = "$4" } },
]

# SQL in the code of the five languages, by its verb and the table it names: a write straight to
# a database is a relation. Upper case only, as SQL in code is written.
[[extractors]]
id = "sql"
files = ["**/*.ts", "**/*.mts", "**/*.cts", "**/*.tsx", "**/*.js", "**/*.mjs", "**/*.cjs", "**/*.jsx", "**/*.py", "**/*.go", "**/*.rs"]
regex = '''\b(?:(SELECT)\b[^;'"`]{0,256}?\bFROM\s+([A-Za-z_][\w.]*)|(INSERT)\s+INTO\s+([A-Za-z_][\w.]*)|(UPDATE)\s+([A-Za-z_][\w.]*)\s+SET\b|(DELETE)\s+FROM\s+([A-Za-z_][\w.]*))'''
emit = [
  { hint = "code.sql", scope = "@id:code.file:$file", key = "$2", attrs = { verb = "$1", table = "$2" } },
  { hint = "code.sql", scope = "@id:code.file:$file", key = "$4", attrs = { verb = "$3", table = "$4" } },
  { hint = "code.sql", scope = "@id:code.file:$file", key = "$6", attrs = { verb = "$5", table = "$6" } },
  { hint = "code.sql", scope = "@id:code.file:$file", key = "$8", attrs = { verb = "$7", table = "$8" } },
]
# The repo's history at the scanned commit: its people, its owner and its co-changing files.
[[extractors]]
id = "git"
builtin = "git"
files = ["**"]
options = { kinds = { repo = "code.repo", file = "code.file", person = "code.person" }, relations = { co_change = "code.co_change", owned_by = "code.owned_by" } }

# Linkers: built-in joins of the hints above across the workspace, into the link snapshot (DR-12).
# runtime_wiring makes each compose service's container and each served route's endpoint, and
# joins calls, queue operations and database opens to the containers they reach.
[[linkers]]
builtin = "runtime_wiring"
options = { kinds = { service = "code.service", repo = "code.repo", endpoint = "code.endpoint" }, relations = { http = "code.http", queue_publish = "code.queue_publish", queue_consume = "code.queue_consume", db = "code.db" } }

# imports joins each import to the workspace package it names, and gives the manifest's
# dependency on that package the import lines that use it. It reads the package nodes and the
# manifests' dependencies, the roles `package` and `depends_on_package` name.
[[linkers]]
builtin = "imports"
options = { kinds = { package = "code.package" }, relations = { imports = "code.imports", depends_on_package = "code.depends_on_package" } }

# Lenses: which relationships a map shows (DR-15).

[[lenses]]
id = "runtime"
label = "Runtime"
relations = ["code.http", "code.queue_publish", "code.queue_consume", "code.db"]
flow = { "code.queue_consume" = "backward" }
level = "container"
default = true

[[lenses]]
id = "flow"
label = "Request and message flow"
relations = ["code.http", "code.queue_publish", "code.queue_consume"]
flow = { "code.queue_consume" = "backward" }
level = "container"

[[lenses]]
id = "dependencies"
label = "Dependencies"
relations = ["code.imports", "code.depends_on_package"]
level = "component"

[[lenses]]
id = "history"
label = "History"
relations = ["code.co_change", "code.owned_by"]
level = "component"

# Questions: named pipelines of query shapes, which ask runs (DR-15). A name resolves at the
# level of the first lens a question names, so path's ends are containers first.

[[questions]]
id = "path"
summary = "How {A} reaches {B}"
args = [{ name = "A" }, { name = "B" }]

[[questions.steps]]
shape = "path"
params = { from = "$A", to = "$B", lens = "flow" }

[[questions]]
id = "why"
summary = "Why {A} depends on {B}"
args = [{ name = "A" }, { name = "B" }]

[[questions.steps]]
shape = "why"
params = { from = "$A", to = "$B" }

[[questions]]
id = "impact"
summary = "What {X} touches"
args = [{ name = "X" }]

[[questions.steps]]
shape = "neighbors"
params = { ids = ["$X"], lens = ["runtime", "dependencies"], direction = "both", depth = 1 }

# Suggestions: the candidates for the pane's one next action (DR-54). The highest priority whose
# `when` holds on the map wins, so a workspace with containers opens on them, and one with only
# directories and files opens on those instead of on an empty level.

[[suggestions]]
when = { kinds = ["code.service", "code.datastore", "code.queue", "code.library", "code.tooling"] }
text = "Open the containers"
action = { command = "map", args = ["--level", "container"] }
priority = 30

[[suggestions]]
when = { kinds = ["code.package", "code.module", "code.directory", "code.api_spec"] }
text = "Open the components"
action = { command = "map", args = ["--level", "component"] }
priority = 20

[[suggestions]]
when = { kind = "code.file" }
text = "Open the files"
action = { command = "map", args = ["--level", "code"] }
priority = 10
