executable = "{path} is executable; a pack holds data, never code"
syntax = "it doesn't fit the pack manifest: {why}"
languages_file = "a languages file holds only [[languages]] and [[extractors]], not {key}"
format = "its format is {found}; this engine reads planroom.pack/v1"
