# Why a pack fails to load (DR-9, DR-46, DR-62); `error.pack_invalid` names the file and line.
[pack]
unreadable = "Planroom can't read it: {why}"
no_manifest = "the pack has no pack.toml"
not_plain = "{path} isn't a plain file; a pack holds plain files and directories only"
executable = "{path} is executable; a pack holds data, never code"
syntax = "it doesn't fit the pack manifest: {why}"
languages_file = "a languages file holds only [[languages]] and [[extractors]], not {key}"
format = "its format is {found}; this engine reads planroom.pack/v1"
id_syntax = "{id} isn't a valid ID: use lowercase letters, digits and _"
id_length = "{id} is longer than {max} characters: a reply shows every ID whole, so an ID can't be that long"
duplicate_pack = "another loaded pack is also named {id}"
builtin_id = "{id} is a built-in pack's ID, and a pack found on a path loads as an out-of-tree pack: give it an ID of its own"
builtin_changed = "{id} is a built-in pack's ID, but this directory's files aren't the {id} pack this build embeds; a pack found on a path loads as an out-of-tree pack, so give it an ID of its own, or build Planroom from this source to check a changed built-in"
duplicate_decl = "[[{table}]] declares {id} twice"
duplicate_key = "{key} in [[{table}]] is already claimed by the {other} pack"
requires_builtin = "a built-in pack may require only code, not {required}"
requires_missing = "it requires {required}, which isn't loaded"
requires_out_of_tree = "{required} is an out-of-tree pack, and an out-of-tree pack may require only built-in packs"
not_qualified = "{reference} isn't qualified: write <pack>.<name>"
out_of_scope = "{reference} belongs to {pack}, which this pack doesn't require"
unknown_kind = "no loaded pack declares the kind {reference}"
unknown_relation = "no loaded pack declares the relation {reference}"
unknown_hint = "no loaded pack declares the hint kind {reference}"
unknown_subject = "no loaded pack declares the kind or relation {reference}"
unknown_lens = "no loaded pack declares the lens {reference}"
unknown_language = "{reference} isn't a loaded [[languages]] ID"
prefix_container = "{kind} is Container-level, so its id_prefix must be container, the kernel's prefix for containers"
prefix_reserved = "{kind} isn't Container-level, so it can't use container, the kernel's prefix for containers"
prefix_kernel = "the prefix {prefix} of {kind} is the kernel's own"
prefix_owned = "the prefix {prefix} of {kind} is already owned by the {owner} pack"
image_kind = "the image role {image} names {kind}, which isn't a Container-level kind"
glob = "{glob} isn't a glob Planroom can match: {why}"
regex = "the regex of {name} doesn't compile: {why}"
unknown_extractor = "this build has no built-in extractor named {builtin}"
unknown_linker = "this build has no built-in linker named {builtin}"
builtin_name = "the built-in {builtin} runs as {name}, so only that pack declares it, under that ID"
options = "the options of {name} must be a table, and its kinds a table of kind names"
# A built-in's options, read through its declared table, and a declarative extractor compiled as
# the runner will run it.
option_unknown = "{key} isn't an option of {name}; a pack sets only {keys}, and the engine fills in the rest"
role_unknown = "{role} isn't a role of {name}; it emits {roles}"
role_missing = "{name} emits a {role}, so its options name one for it"
hint_attr = "{attr} isn't an attribute of the hint kind {hint}; it declares {attrs}"
not_an_id = "{reference} names no node by its ID: a parent or a hint's scope is @id:KIND:KEY or an ID, never an alias"
unknown_variable = "{reference} isn't a variable: a template takes $file, $stem, $repo, $line, $1 to $9 for a regex's groups, and @name for a query's captures"
unknown_group = "the regex of {name} has {groups} groups, so it has no ${group}"
template_too_long = "a template of {name} is longer than {bytes} bytes or names more than {vars} variables: split it, or name fewer"
query = "the query of {name} doesn't compile: {why}"
no_grammar = "{reference} has no built-in grammar, so a query can't parse it; this build parses {grammars}"
confidence = "a confidence is between 0 and 1, not {reference}"
prop_type = "{prop} on {kind} is typed {types}, which no capture fills: give the prop a type a capture reads as (string, boolean, integer, number, null or array), or a plain value"
prop_keyword = "{keyword} on the prop {prop} of {kind} is a keyword the runner doesn't enforce: a prop's schema takes only type, enum, minimum, maximum, items with a type, and description"
schema_keyword = "{keyword} in the prop schema of {kind} is a keyword the runner doesn't enforce: a prop schema takes only type, properties and description"
prop_malformed = "{keyword} on the prop {prop} of {kind} is written in a form the runner can't enforce: type is string, boolean, integer, number, null, array or object, or a list of them; enum is a non-empty list of values of the prop's type; minimum and maximum are numbers; and items is a table whose type is string, boolean, integer, number, null or array"
prop_not_a_table = "the schema of the prop {prop} under {keyword} in {kind} isn't a table: write a table of type, enum, minimum, maximum, items and description, or an empty table for an untyped prop"
schema_malformed = "{keyword} in the prop schema of {kind} isn't a table: write a table that maps each prop to its schema"
schema_not_a_table = "the {keyword} of {kind} isn't a table: write a table of type = \"object\", properties and description, or leave {keyword} out"
schema_type = "the {keyword} of the prop schema of {kind} must be \"object\", since every emit gives an object of props: write type = \"object\", or leave {keyword} out"
prop_value = "the value {reference} that {name} gives {prop} breaks the {keyword} that {kind} declares for it: write a value the prop's schema takes"
hint_unconsumed = "no loaded linker joins the hint kind {hint}, so it would join nothing: emit an existing hint kind, or name the target with @alias:KEY or @ext:NAME to join on the same key"
bare_ref = "{reference} isn't a reference: write @id:KIND:KEY, @alias:KEY, @ext:NAME or an ID"
node_id = "{reference} isn't a node ID: write <namespace>:<kind-short>:<key>, or a question's argument such as $X"
unknown_prefix = "the ID {reference} has the kind-short {prefix}, which no loaded kind declares as its id_prefix"
prefix_scope = "the ID {reference} has the kind-short {prefix}, which belongs to {pack}, which this pack doesn't require"
owner_shape = "the {name} shape"
owner_rule = "the {name} rule type"
param_unknown = "{key} isn't a parameter of {owner}; it takes {keys}"
params_table = "the parameters of {owner} must be a table"
param_value = "{key} names something: give a name, a list of names or an in list"
kind_is_relation = "{reference} is a relation, but {key} names node kinds"
lens_flow = "the lens {lens} gives a flow for {relation}, which it doesn't lift"
default_lens = "the lenses {first} and {second} are both the default; only the code pack's may share it"
lens_all = "no lens may be called all: --lens all already means every relation of every loaded pack"
question_builtin = "{id} is a question the engine serves itself, so no pack declares it"
steps = "the question {id} has {count} steps; a question has one to three"
suggestion = "a suggestion can't name {command}: it must be a command that can be undone, doesn't hand off and never spends"
stages = "only the plan pack declares [[stages]]"
stage_rule = "the stage {stage} lints with {rule}, which isn't one of this pack's [[rules]]"
item_prop_conflict = "the item type {item} declares its prop {prop} two ways; every stage that declares it gives one schema"
file_missing = "the pack holds no file {reference}"
unknown_key = "{key} isn't a key of {table}; it takes {keys}"
owner_effect = "the {name} effect"
owner_predicate = "a when predicate"
no_params = "no parameters"
param_plain = "{key} names nothing, so it takes a number, a word or text, or a list of them, never a table"
argument_undeclared = "{reference} names the argument {name}, which the question doesn't declare; it declares {args}"
no_args = "no arguments"
param_test = "{key} is a field test: give a value, or a table of one lt or gt with a number, or of in with a list of values"
placeholder = "{reference} holds a placeholder, but a kind, relation or lens is always spelled out"
placeholder_id = "{reference} is a placeholder where none stands in: only a question's step takes its arguments, such as $X, and only an effect takes $pick"
prefix_placeholder = "the ID {reference} has a placeholder for its kind-short; spell the kind-short out, or write @id:KIND:KEY"
action_args = "the action {command} doesn't parse as the CLI parses it: {why}"
# doctor --pack: the conformance kit's failures and its lines.
expected_missing = "the pack has tests/inputs/ but no tests/expected.jsonl; planroom doctor --pack DIR --update writes it"
expected_differs = "this run's facts differ from tests/expected.jsonl at line {line}; if the change is meant, planroom doctor --pack DIR --update rewrites it"
not_deterministic = "a second run of {name} over tests/inputs/{repo} gave other facts"
evidence = "{fact} cites line {line} of {path}, which doesn't hold that text"
eval_line = "line {line} isn't a JSON object"
extract_failed = "{name} couldn't run: {why}"
check_validate = "{kinds} kinds, {relations} relations, {extractors} extractors and {lenses} lenses; every reference resolves"
check_expected = "{batches} fact batches over {repos} input repos match tests/expected.jsonl"
check_updated = "Wrote tests/expected.jsonl: {batches} fact batches over {repos} input repos"
check_no_inputs = "no tests/inputs/, so no extractor ran"
check_determinism = "a second run gave the same facts, byte for byte"
check_evidence = "{count} evidence lines match their input files"
check_evals = "{count} eval case files read"
summary = "Pack {id} version {version} passes {count} checks."
needs_pack = "doctor runs one check in this build, a pack's: pass --pack DIR"

# The line that names the repos with uncommitted work, which never reaches the map (DR-71, DR-85).
[dirty]
one = "{repo}: {files} uncommitted files aren't on the map."
one_file = "{repo}: 1 uncommitted file isn't on the map."
repo = "{repo} ({files})"
many = "{count} repos have uncommitted files that aren't on the map: {names}."

