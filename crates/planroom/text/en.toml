# The model boundary's own lines (DR-89).
[models]
replay_only = "Model calls answer from recordings until the consent card and the daily cap arrive, and this call has none, so nothing was sent."
internal = "a model call's request or recording couldn't be built or written"

# Cards a write deals (DR-89): each card names its question and why lines by these keys, and its
# choices' labels. `{count}` is derived live where a card counts what waits on it.
[card]
apply_question = "Apply {count} edits from the shared page?"
apply_why = "No paired device signed them, so each waits as a proposal until you review it."
apply_accept = "Apply"
apply_reject = "Discard"
apply_item = "Apply this edit"
trust_question = "This workspace's {dir} wasn't made by Planroom here. Trust it and load its config?"
trust_why = "It may have come with a repo, a copy or an older Planroom, so its config is ignored until you trust it."
trust_accept = "Trust it"
trust_reject = "Keep it ignored"
unknown = "A {kind} card from a newer Planroom waits; update Planroom to pick it."
focus_line = "Decide: {question}"

# `review ID accept|reject` (DR-5, DR-54, DR-89).
[review]
accepted = "Accepted {event}: the edit {edit} copies it."
rejected = "Rejected {event}; it stays out of the map."
picked = "Picked {verdict} on the card {card}."
card_resolved = "That was the last edit waiting on the card {card}, so it closes as {verdict}."
apply_card = "The Apply card {card} is picked one edit at a time: {count} wait, such as {ghosts}."
not_reviewable = "{event} is no ghost, conflict or card, so there's nothing to review."
already_reviewed = "{event} was already reviewed ({pick}); undo that review to review it again."
undone = "{event} was undone, so there's nothing to review."
replayed = "This repeats an earlier review with the same base, so nothing new was written."
trusted = "This workspace is trusted now: the next scan loads its config."
kept = "Its config stays unloaded."

# Why a read is refused a path (`path_refused`, DR-52): the `{why}` of its line.
[confine]
outside_workspace = "it's outside this workspace's repos"
outside_root = "it's outside this workspace's root, or in its state directory or a git directory"
credential = "it may hold a credential, so only a person may name it"

