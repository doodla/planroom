model_record_without_live_flag = "export PLANROOM_REPLAY=strict"
model_credential_host = "planroom doctor"
model_api_key_env = "planroom doctor"
model_unknown_model = "planroom doctor"
model_purpose = "planroom doctor"
model_model_setting = "planroom doctor"

