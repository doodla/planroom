engine_unavailable = "The Planroom engine isn't available: {reason}."
base_required = "{command} changes what a person wrote, so it needs --base: the seq of the view you acted on."
actor_required = "{command} needs to know who is acting: set PLANROOM_ACTOR, or run it from a terminal."
stale_write = "{name} changed since the view you acted on, at seq {seq}; your edit is kept as a conflict."
ambiguous_ref = "{target} names {count} records, such as {ids}; pass one of their IDs."
already_resolved = "That card was already picked: {pick}, by {by} at {at}."
handoff_conflict = "The merge would conflict in {repo}, so no repo was changed."
consent_required = "Planroom needs your yes before it asks {provider}: pick it on the consent card."
path_refused = "Planroom won't read {path}: {why}."
repo_config_refused = "{repo}'s local git config names a command git would run ({keys}), so Planroom won't check out or merge there."
budget_exceeded = "The {guard} budget stopped this call: {spent} of {limit} spent."
model_unavailable = "{provider} can't be reached, so this command can't run."
git_too_old = "git {found} is too old; Planroom needs {minimum} or newer."
git_missing = "No git on PATH answered; Planroom needs git {minimum} or newer."
packs_mismatch = "This engine loaded other packs than the ones this workspace records, so it won't write."
replay_missing = "No recorded model reply for {key}, and replay is strict."
serve_limit = "The canvas server is at its limit: {what}."
pack_invalid = "The pack file {file} isn't valid at line {line}: {why}"

[hint]
workspace_not_found = "planroom scan DIR"
idempotency_mismatch = "pass a new --idem to make another write"
store_busy = "retry the same command"
schema_mismatch = "/plugin marketplace update planroom, then /plugin update planroom@planroom, typed in Claude Code; then restart this session"
port_in_use = "planroom serve --port N"
person_required = "press the action's button in the Planroom pane"
person_required_room = "{line}, typed in Claude Code"
person_required_terminal = "{line}, from your own terminal: it asks you to confirm"
person_required_room_or_terminal = "{room}, typed in Claude Code, or {line}, from your own terminal: it asks you to confirm"
person_required_key = "claude, started in this workspace: the Planroom mod registers its key, and its pane offers Use this session's key when another is registered"
person_key_mismatch = "press Use this session's key in the Planroom pane"
engine_fetching = "try again in a few seconds"
engine_unavailable = "scripts/planroom build"
git_failed = "git -C {path} --git-dir=.git status"
git_failed_not_a_file = "ls -l {path}"
base_required = "pass --base with the seq from meta.seq"
actor_required = "export PLANROOM_ACTOR=agent:<id>:<role>"
stale_write = "planroom show {event}"
consent_required = "pick the consent card in the Planroom pane"
git_too_old = "install git 2.34.1 or newer, then retry"
packs_mismatch = "restart this Planroom process, or update Planroom"
data_root = "export PLANROOM_DATA=DIR"
serve_limit = "retry in a few seconds"
pack_invalid = "planroom doctor --pack DIR"
model_spend_log_relative = "export PLANROOM_SPEND_LOG=\"$(git rev-parse --path-format=absolute --git-common-dir)/../docs/evidence/spend.jsonl\""
model_spend_log_missing = "export PLANROOM_SPEND_LOG=\"$(git rev-parse --path-format=absolute --git-common-dir)/../docs/evidence/spend.jsonl\""
