# Each empty state's line, which every surface shows (`Empty.line`), and the short label of its
# next action (`_next`), which a surface puts on the button beside it. The line is masked like the
# names it holds; a label never is, as a handle never is, so it names no repo text (text::LABELS).
[empty]
not_scanned = "Nothing is mapped here yet; {count} repos can be."
not_scanned_next = "Map these {count} repos? About 2 s."
no_repos = "No git repos here. Open Planroom in a folder that holds your repos, or clone one here, then check again."
no_intent = "No plans at the intent level yet."
empty_level = "Nothing at the {level} level here."
top_next = "Show the top of the map"
nothing_mapped = "The last scan found nothing to map."
nothing_mapped_next = "Scan again"
nothing_under = "Nothing under {name} at the {level} level."
nothing_under_next = "Show it among the blocks beside it"
nothing_after_cursor = "The map moved on, and nothing is left after this page's place."
nothing_after_cursor_next = "Show the first page"
repos_unborn = "No commits yet in {names}, so there's nothing to map. Make a first commit, then check again."
repos_unreadable = "git can't read {names} here, so there's nothing to map yet. Run git status in each to see why, then check again."
repos_other_owner = "A user other than you owns {others}, and Planroom never runs git in another user's repo, so there's nothing to map yet. Its owner can scan each, or you can scan a copy you own, then check again."
repos_unreadable_other_owner = "git can't read {names} here, and a user other than you owns {others}, where Planroom never runs git, so there's nothing to map yet. Run git status in each repo git can't read to see why, then check again."
# Repos whose own places are the person's but that read objects another user owns: the person
# owns them, so the line never says their owner can scan them. Worded to fit one repo or several.
repos_borrowed = "Another user owns objects read by {borrowers}, and Planroom never runs git in another user's repo, so there's nothing to map yet. You can scan a copy of each that borrows none of those objects, then check again."
# Beside other reasons, each reason is one sentence of `{reasons}`, in this order.
repos_mixed = "Nothing here can be mapped yet. {reasons} Then check again."
reason_unreadable = "git can't read {names}; run git status in each to see why."
reason_other_owner = "A user other than you owns {others}, where Planroom never runs git; its owner can scan each, or you can scan a copy you own."
reason_borrowed = "Another user owns objects read by {borrowers}, and Planroom never runs git there; you can scan a copy of each that borrows none of those objects."
check_again_next = "Check again"
no_match = "Nothing on the map matches {text}."
lens_shows_nothing = "The {lens} lens shows nothing at the {level} level."
lens_shows_nothing_next = "Show every block at this level"
no_answer = "{asked}: nothing on the map answers it."
no_answer_next = "Show what you can ask"
no_intent_plan = "No plan here yet: start one with planroom intent new \"TEXT\"."
no_intent_next = "Show how to start a plan"
no_plan_items = "The plan {project} has no items yet; its next stage is {stage}."
no_plan_items_next = "Show the next stage's checklist"
no_findings = "Lint finds nothing missing in the plan {project}."
no_findings_next = "Show the plan"

# The fix a repo_skipped warning names for git_failed. other_owner has none: Planroom never runs git
# in another user's repo, and names no command to run there.
[fix]
git_failed = "Run git -C {path} --git-dir=.git status to see why, fix it, then scan again."
git_failed_not_a_file = "Run ls -l {path} to see what it is: git needs a directory or a regular file there. Replace it, then scan again."

[scan]
summary = "Mapped {repos} repos, {moved} of them moved: {containers} containers, {nodes} nodes, {hints} hints."
unborn = "No commits yet in {names}; each maps after its first commit."
next_label = "Show the map"

[focus]
