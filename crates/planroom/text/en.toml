# Every user-facing string the engine authors. `{name}` is replaced by the value of that name.

[error]
invalid_argument = "{what}"
workspace_not_found = "No Planroom workspace or git repos at {path}."
idempotency_mismatch = "The key {idem} was already used for another request."
store_busy = "The store is still locked by another Planroom process after 5 s."
schema_mismatch = "This store is version {found}, newer than this engine reads ({supported})."
git_failed = "git failed in {repo}: {what}"
internal = "Planroom hit a bug: {what}"
person_required = "Only a person can run {command}: press its button in the Planroom pane."
port_in_use = "Port {port}, this workspace's canvas address, is in use by another program. Stop it and press e again, or run planroom serve --port N to move; a tab's unsent edits stay with the old address."
unauthorized = "This tab needs a fresh link: press e in the pane."
not_found = "There is no {what}."
person_key_mismatch = "Another person key is registered for this workspace, since {registered_at}."
# The resolver's two codes: plugin/scripts/planroom prints them before any engine runs, with its
# own line for each reason; these are the fallbacks a surface shows when it has no such line.
engine_fetching = "Another session is fetching the Planroom engine."
engine_unavailable = "The Planroom engine isn't available: {reason}."

[hint]
workspace_not_found = "planroom scan DIR"
idempotency_mismatch = "pass a new --idem to make another write"
store_busy = "retry the same command"
schema_mismatch = "update Planroom, then retry"
port_in_use = "planroom serve --port N"
person_required = "press the action's button in the Planroom pane, or type it after /room"
person_key_mismatch = "press Use this session's key in the Planroom pane"
engine_fetching = "try again in a few seconds"
engine_unavailable = "scripts/planroom build"
git_failed = "git -C {path} status"

# The data root's shared files (DR-78).
[data]
newer_file = "{file} is {found}, newer than this engine reads ({supported}). Update Planroom, then retry."

[argument]
focus_unsupported = "--focus isn't available yet; run map without it."
person_key = "stdin must hold the person key: the base64url of an uncompressed P-256 point."
bad_body = "The request body isn't valid: {why}"
http_scan_dir = "scan over HTTP always maps the workspace it serves; leave dir out or name that workspace."
http_command = "command {command} on this server"
unknown_leaf = "No command {leaf} in the catalogue; planroom schema --commands lists them."
import_stdin = "import takes Artifact rows only on stdin: run planroom import -."
share_out = "--out must name a directory Planroom can write: {why}"
usage = "The command line isn't valid: {why}."
schema_label = "The {leaf} command's arguments and result"

[warning]
evidence_dropped = "{count} evidence items in {repo} didn't match commit {commit} and were dropped."
partial_scan = "{count} files in {repo} weren't scanned by {extractor}: past its bound, or missing from a partial clone."
partial_parse = "{count} files in {repo} couldn't be read in full."
workspace_nested = "Another workspace sits inside this one, at {other_root}; the two stay apart."
repo_unborn = "{repo} has no commits yet; it maps after its first commit."
repo_skipped_other_owner = "Another user owns {repo}, so git won't read it and this scan left it out. {fix}"
repo_skipped_git_failed = "git can't read {repo}, so this scan left it out. {fix}"
scan_superseded_head_moved = "{repo}'s HEAD moved on while this scan read {commit}, so its map stays as it was. Scan again to map HEAD."
scan_superseded_repos_changed = "The workspace's repos changed while this scan read {repo}, and a newer scan has mapped it since, so its map stays as that scan left it."
truncated = "This map has {total} blocks; the first {kept} fit its {budget}-token budget. Next: {label}."
warnings_left_out = "{count} more warnings ({codes}) were left out to keep this reply to its {budget}-token budget."
reply_over_budget = "This reply passes its {budget}-token budget; that's a bug, so please report it."

[empty]
not_scanned = "Map these {count} repos? About 2 s."
no_repos = "No git repos here. Open Planroom in a folder that holds your repos, or clone one here, then check again."
no_intent = "No plans at the intent level yet. Show the top of the map."
empty_level = "Nothing at the {level} level here. Show the top of the map."
nothing_mapped = "The last scan found nothing to map. Scan again."
repos_unborn = "No commits yet in {names}, so there's nothing to map. Make a first commit, then check again."
repos_unreadable = "git can't read {names} here, so there's nothing to map yet. Run git status in each to see why, then check again."

# The fix a repo_skipped warning names, by its reason.
[fix]
other_owner = "Make it yours with chown -R \"$(id -un)\" {path}, or scan as the user who owns it."
git_failed = "Run git -C {path} status to see why, fix it, then scan again."

[scan]
summary = "Mapped {repos} repos, {moved} of them moved: {containers} containers, {nodes} nodes, {hints} hints."
unborn = "No commits yet in {names}; each maps after its first commit."
next_label = "Show the map"

[focus]
summary = "{name} · {level} · lens {lens} · seq {seq}"
blocks = "{count} at the top: {names}."
next = "Next: {label}"
next_containers = "Open the containers"
no_drift = "No drift: no intended rule broken, no machine drift."

# The panes the mod draws before the engine answers `focus` (DR-57). `cargo xtask gen` writes
# them into `packages/contract/src/generated/catalogue.ts` as FALLBACK_PANES. Each state has a
# headline, an optional detail and an optional action label.
[fallback]
resolving_headline = "Looking for the Planroom engine…"
resolving_action = "Check again"
fetching_headline = "Getting the Planroom engine…"
fetching_action = "Check again"
build_offered_headline = "Build the engine from source, about 4 minutes?"
build_offered_action = "Build it"
building_headline = "Building the engine from source…"
building_detail = "This takes about 4 minutes."
building_action = "Check again"
version_mismatch_headline = "This engine doesn't match the plugin."
version_mismatch_action = "Try again"
person_key_mismatch_headline = "This workspace knows another person key."
person_key_mismatch_detail = "Presses from this session can't act as you until you use its key."
person_key_mismatch_action = "Use this session's key"
unsupported_platform_headline = "Planroom can't run here."
unsupported_platform_detail = "Planroom v0.1 runs on macOS, Linux and WSL 2. Open this repo from WSL."
failed_headline = "The Planroom engine isn't available."
failed_action = "Try again"
no_focus_headline = "Planroom couldn't show this folder."
no_focus_action = "Try again"

[map]
summary = "{count} at the top: {names}."
more = "{names}; and {more} more"
coarser = "Show the {level} level"
pane = "Show where you are"

[frame]
scan = "Scanned {repo} at {commit}."
scan_unborn = "{repo} has no commits yet; it maps after its first commit."
version = "Tagged {label}."
other = "A {kind} event."

[person]
registered = "Registered the person key {fingerprint} for this workspace."
already = "The person key {fingerprint} is already registered for this workspace."
rekeyed = "Replaced this workspace's person key with {fingerprint}."

[serve]
summary = "Serving the canvas at {url}; open it with the login page this serve wrote."
session = "Signed in."

[canvas]
missing_title = "Planroom"
missing_checkout = "This engine was built without the canvas. Run cargo xtask gen --canvas, then rebuild."
missing_install = "This engine was built without the canvas. Install Node 22 and pnpm, then run scripts/planroom build."

[version]
summary = "planroom {version} for {target}, catalogue {hash}."

[schema]
summary = "Planroom contract schema version {version}: {id}"
commands = "{count} commands in the catalogue."
commands_label = "List every command"
leaf = "{leaf} takes {request} and returns {result}."
leaf_brief = "{leaf} takes {request} and returns {result}; to keep to the budget, only the request's types keep their descriptions."
leaf_bare = "{leaf} takes {request} and returns {result}; to keep to the budget, the types leave out their descriptions."

# share and import: the Artifact bundle and the inbox (architecture.md, Remote mode).
[share]
summary = "Shares {repos} repos, {blocks} blocks at the top level and the pane, with paths and line numbers; {code}; {presence}."
no_code = "no code text"
code = "code lines, redacted"
no_presence = "no presence"
presence = "who is working on what"
title = "Planroom Canvas"
description = "The {workspace} workspace's map from Planroom: browse it, and ask your computer for what it doesn't hold."
unavailable = "Not in this snapshot. Ask your computer for it"
no_canvas = "canvas build in this engine"

[import]
summary = "Read requests answered: {answered}. Rows refused: {refused}. Rows left for a person's sync: {left}."
not_a_row_path = "{path} isn't an inbox row's path, inbox/<uid>/events/<docId>."
not_json = "A line on stdin isn't JSON: {why}"
malformed = "This row isn't a valid planroom.inbox/v1 row: {why}"
newer_format = "This row's format {format} is newer than this engine reads."
not_allowed = "An Artifact row can't name {command}."
not_yet = "{command} from an Artifact row isn't importable yet."
read_not_yet = "{command} isn't answerable from the Artifact yet."
bad_request = "This {command} request isn't valid: {why}"
too_large = "This answer is larger than one db document holds; ask for a smaller view."
left = "Waits in the inbox for a person's /room sync."
map_label = "The map at the {level} level"
