# The checks that may print `skipped` under CI=true. Every other skipped check fails in CI
# (repo-layout.md, The one task entry point; DR-79). Each entry names the check as its report line
# prints it, the reason, and the decision record that approved the skip:
#
# [[skip]]
# check = "the step's name"
# reason = "why it can't run in CI"
# record = "DR-n"
#
# A test that skips itself prints as `RUNNER: TEST`, such as `cargo nextest: planroom::scan a_test`,
# `vitest: packages/mod/src/x.test.ts > name` or `playwright: surface.spec.ts > title [specs]`
# (crates/xtask/src/testrun.rs), and is declared under that name.
#
# None today: CI installs what each step needs (crates/xtask/src/tools.rs), and no test skips itself.
