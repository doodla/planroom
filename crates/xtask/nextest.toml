# cargo nextest's configuration; `cargo xtask test` passes it with --config-file.

# A test that waits on something that never comes (a terminal, a pipe a child still holds) is
# reported by name and stopped after 4 minutes, rather than holding the run until the CI job's own
# timeout cancels it with no name. The slowest test takes well under a minute.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 4 }

# A test that asserts a wall-clock budget runs with no other test beside it, so a busy CI runner
# can't stretch its timings. Its file's in-process lock serializes it under cargo test, which runs
# a binary's tests as threads of one process; nextest runs each test in a process of its own, so
# only this setting keeps the rest of the suite off the machine while it runs.
[[profile.default.overrides]]
filter = """
(binary_id(planroom::live) & (
    test(=watch_frames_every_commit_of_three_writers_and_a_rescan_within_1_s)
  | test(=own_commits_reach_the_live_loop_through_the_commit_hook_without_a_poll)))
| (binary_id(planroom::watch) & (
    test(=watch_replays_after_since_then_streams_each_new_commit)
  | test(=an_older_watch_exits_with_schema_mismatch_within_one_poll_of_a_migration)))
| (binary_id(planroom::server_auth) & (
    test(=a_frame_arrives_within_1s_of_a_cli_commit_and_of_serves_own_write)
  | test(=serve_detach_returns_at_once_and_keeps_serving)))
| (binary_id(planroom::scan) & test(=a_scan_finds_the_truths_compose_containers_with_evidence_on_their_lines))
| (binary_id(planroom-store::concurrency) & test(=three_writer_processes_commit_500_each_with_no_loss_and_no_busy))
| (binary_id(planroom-store::migrations) & test(=an_older_watch_exits_after_a_migration))
| (binary_id(planroom::s01_first_look) & test(=cold_scan_under_5_s))
| (binary_id(planroom-kernel::query) & test(=a_query_stays_linear_in_the_size_of_the_model))
| (binary_id(planroom-extract::contract) & (
    test(=a_regex_runs_in_linear_time_over_a_1_mib_file)
  | test(=a_query_over_deeply_nested_code_runs_in_linear_time)
  | test(=a_file_past_the_work_bound_is_partial_and_gives_no_fact)
  | test(=what_many_small_files_hold_is_bounded_by_their_own_budgets)
  | test(=a_text_predicate_reads_within_the_work_bound)
  | test(=the_evidence_of_every_line_of_a_1_mib_file_verifies_in_linear_time)
  | test(=a_compose_file_cites_its_lines_in_linear_time)))
| (binary_id(planroom-extract::link) & (
    test(=one_files_many_opens_and_calls_link_in_linear_time)
  | test(=calls_against_many_endpoints_at_one_path_link_in_linear_time)
  | test(=many_reads_of_a_variable_set_many_times_link_in_linear_time)
  | test(=many_files_reading_a_variable_set_many_times_link_in_linear_time)
  | test(=many_containers_sharing_one_host_link_in_linear_time)
  | test(=many_containers_combining_a_shared_host_with_their_own_link_in_linear_time)))
"""
threads-required = "num-test-threads"
