[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/doodla/planroom"

[workspace.dependencies]
planroom-contract = { path = "crates/contract", version = "=0.1.0-dev" }
planroom-extract = { path = "crates/extract", version = "=0.1.0-dev" }
planroom-kernel = { path = "crates/kernel", version = "=0.1.0-dev" }
planroom-models = { path = "crates/models", version = "=0.1.0-dev" }
planroom-store = { path = "crates/store", version = "=0.1.0-dev" }
planroom-testkit = { path = "crates/testkit", version = "=0.1.0-dev" }

clap = { version = "=4.6.7", features = ["derive"] }
jsonschema = { version = "=0.58.6", default-features = false }
schemars = { version = "=1.2.2", features = ["preserve_order"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
toml = "=1.1.8"
globset = "=0.4.20"
ignore = "=0.4.33"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
saphyr-parser = "=0.1.0"
regex = "=1.13.1"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
uuid = { version = "=1.28.0", features = ["v7"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "std"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "net", "sync", "time", "signal", "macros"] }
tokio-stream = { version = "=0.1.19", features = ["sync"] }
libc = "=0.2.190"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
nucleo-matcher = "=0.3.1"
# The Claude and Jev transports: rustls with the ring provider, so neither OpenSSL nor aws-lc
# enters the tree (DR-39). reqwest's `rustls` feature would bring aws-lc-rs; `rustls-no-provider`
# leaves the provider to planroom-models, which hands reqwest ring's.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "blocking"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

# Line tables keep backtraces readable at about a third of full debuginfo's disk,
# so several worktrees' targets fit at once.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
