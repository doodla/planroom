name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch or pull request cancels its older runs. Runs on main each get a group
# of their own, so none is cancelled or replaced.
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The layout gate walks the commits a push adds, which needs the full history (DR-70).
          fetch-depth: 0
      # Installs the toolchain rust-toolchain.toml pins, with its components and targets.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # pnpm comes from corepack, at the version package.json's packageManager pins.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The layout gate walks the commits a push adds, which needs the full history (DR-70).
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask test

  # cargo deny check advisories and pnpm audit --prod, which need the network; the pin-age check
  # isn't built yet. cargo xtask installs the sha256-pinned cargo-deny itself.
  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: cargo xtask check audit

  guardrails:
    name: guardrails
    # Also inside `cargo xtask check`; a job of its own shows a hook regression by name.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The layout gate walks the commits a push adds, which needs the full history (DR-70).
          fetch-depth: 0
      - run: rustup toolchain install
      - run: cargo xtask check guardrails

  # Installs the pinned Playwright's Chromium (with its system packages), builds the canvas, the
  # engine with the canvas embedded and the fixture (python3 and git from the runner image), then
  # runs the specs against the real `planroom serve`, and the M1/M2 states against the stand-in.
  # No secret and no network beyond the installs. The 1 s interactive gate runs only here, on
  # ubuntu-24.04 (DR-43).
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The layout gate walks the commits a push adds, which needs the full history (DR-70).
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: cargo xtask e2e

  # ShellCheck, then the suite under sh, dash and (Linux only) BusyBox sh. Under CI=true a skipped
  # step fails, so cargo xtask installs a missing tool first (DR-79).
  installer:
    name: installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The layout gate walks the commits a push adds, which needs the full history (DR-70).
          fetch-depth: 0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask test --installer

  # TODO: `cargo xtask release-dry-run` doesn't exist yet. Remove `if: false` then.
  release-dry-run:
    name: release-dry-run (${{ matrix.target }})
    if: false
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - run: cargo xtask release-dry-run --target ${{ matrix.target }}
