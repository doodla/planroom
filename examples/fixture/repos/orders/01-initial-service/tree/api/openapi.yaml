openapi: 3.0.3
info:
  title: Acme Orders API
  version: "1"
  description: Create and read orders.
servers:
  - url: http://orders:8080
paths:
  /orders:
    post:
      operationId: createOrder
      summary: Create an order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: The new order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request body.
        '422':
          description: Missing or invalid fields.
  /orders/{id}:
    get:
      operationId: getOrder
      summary: Get an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: No order with that ID.
    get:
      operationId: healthz
      summary: Liveness and database check
      responses:
        '200':
          description: The service and its database are up.
        '503':
          description: The database is unreachable.
components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^ord_[0-9a-f]{16}$'
  schemas:
    CreateOrderRequest:
      type: object
      required: [customer_id, items]
      properties:
        customer_id:
          type: string
        currency:
          type: string
          default: USD
        payment_ref:
          type: string
          description: Set when checkout has already charged the customer.
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Item'
    Item:
      type: object
      required: [sku, quantity, price_cents]
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
        price_cents:
          type: integer
          format: int64
    OrderState:
      type: string
      enum: [created, paid, payment_failed, fulfilling, shipped, delivered, cancelled, on_hold]
    Order:
      type: object
      properties:
        id:
          type: string
        customer_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        total_cents:
          type: integer
          format: int64
        currency:
          type: string
        state:
          $ref: '#/components/schemas/OrderState'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
