[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-worker"
version = "0.7.0"
description = "Acme Shop fulfilment worker: pops order-jobs from Redis and ships orders."
requires-python = ">=3.12"
dependencies = [
    "redis==5.0.8",
]

[project.scripts]
acme-worker = "worker.main:main"

[tool.setuptools]
packages = ["worker"]
