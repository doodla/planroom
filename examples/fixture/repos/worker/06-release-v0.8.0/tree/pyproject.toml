[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "acme-worker"
version = "0.8.0"
description = "Acme Shop fulfilment worker: pops order-jobs from Redis and ships orders."
requires-python = ">=3.12"
dependencies = [
    "redis==5.0.8",
    "psycopg[binary]==3.2.2",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.27.0",
    "prometheus-client==0.21.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.3", "ruff==0.6.8"]

[project.scripts]
acme-worker = "worker.main:main"

[tool.setuptools]
packages = ["worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
