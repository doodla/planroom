# Acme Shop, all services on one host. `docker compose up -d`.
name: acme-shop

services:
  storefront:
    image: acme/storefront:2.2.0
    ports:
      - "3000:3000"
    environment:
      - ORDERS_URL=http://orders:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - orders

  orders:
    image: acme/orders:1.4.0
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://orders:orders@orders-db:5432/orders?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - orders-db
      - redis

  worker:
    image: acme/worker:0.8.0
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://orders:orders@orders-db:5432/orders
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - redis
      - orders-db

  redis:
    image: redis:7.4

  orders-db:
    image: postgres:16.4
    environment:
      - POSTGRES_USER=orders
      - POSTGRES_PASSWORD=orders
      - POSTGRES_DB=orders
    volumes:
      - orders-db-data:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

volumes:
  orders-db-data:
