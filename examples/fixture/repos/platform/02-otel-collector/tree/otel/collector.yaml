# OpenTelemetry Collector: receives OTLP from the services' SDKs.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Prometheus scrapes this endpoint (job otel-collector).
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otelcol
  # There is no trace backend yet; spans are logged.
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
