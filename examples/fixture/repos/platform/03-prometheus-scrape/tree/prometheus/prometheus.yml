global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: orders
    static_configs:
      - targets: ["orders:9464"]
  - job_name: worker
    static_configs:
      - targets: ["worker:9464"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
